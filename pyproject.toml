[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "job-aggregator"
version = "0.12.0"
description = "A self-hosted job-alert pipeline: polls public ATS endpoints and job boards, hard-filters postings against your criteria, LLM-scores the survivors against your profile, and pushes the keepers to ntfy and Discord."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sean Campbell" }]
keywords = [
  "job-search",
  "ats",
  "greenhouse",
  "lever",
  "workday",
  "job-board",
  "llm",
  "notifications",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Office/Business",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "anthropic>=0.40",
  "google-genai>=1.0",
  "ollama>=0.4",
  "apscheduler>=3.10",
  "argon2-cffi>=25.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "freezegun>=1.4",
  "mammoth>=1.6",
  "python-multipart>=0.0.9",
  "reportlab>=4.0",
  "python-docx>=1.1",
]
web = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "segno>=1.6",
  "pypdf>=4.0",
]
render = [
  "weasyprint>=60",
  "jinja2>=3.1",
  "mammoth>=1.6",
]
headless = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/seancampbell3161/job-aggregator"
Repository = "https://github.com/seancampbell3161/job-aggregator"
Changelog = "https://github.com/seancampbell3161/job-aggregator/blob/main/CHANGELOG.md"
Issues = "https://github.com/seancampbell3161/job-aggregator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: hits live endpoints (skipped by default)",
]
addopts = "-m 'not integration'"
