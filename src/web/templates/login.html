{% extends "auth_base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<form class="auth-form panel" method="post" action="/login">
  <h1>Sign in</h1>
  {% if claimed %}<p class="muted">This instance already has a password.</p>{% endif %}
  {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
  <input type="text" name="username" value="admin" autocomplete="username" hidden>
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Sign in</button>
  <p class="muted">Forgot it? On the server, run
  <code>python -m src.settings set-password</code>.</p>
</form>
{% endblock %}
