{% extends "settings_base.html" %}
{% block section %}
<p><a href="/settings/{{ section.slug }}">&larr; Back to {{ section.title }}</a></p>
<h3>Remove &mdash; {{ path }}</h3>
<p>Remove this entry?</p>
<ul class="row-summary-list">
  {% for name, v in row.values.items() %}<li>{{ name }}: {{ v if v is not none else '—' }}</li>{% endfor %}
</ul>
<form method="post" action="/settings/rows/{{ path }}/{{ digest }}/remove">
  <button type="submit" class="btn primary">Remove</button>
  <a class="btn small" href="/settings/{{ section.slug }}">Cancel</a>
</form>
{% endblock %}
