# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://github.com/Keats/tera#readme
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# A Tera template to be rendered for each release in the changelog.
# See https://github.com/Keats/tera#readme
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING:** {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
# A Tera template to be rendered as the changelog's footer.
# See https://github.com/Keats/tera#readme
#
# The repo URL is written out rather than built from `remote.github.*`: those
# fields are empty unless a `[remote.github]` section is declared (they rendered
# as https://github.com///compare/...), and declaring one switches on git-cliff's
# GitHub integration, which calls api.github.com and PANICS on any non-200 —
# so a release could not be cut offline or without a token.
#
# NOTE: `--prepend` (the documented workflow) does not emit this footer at all.
# The link line for a new version is added by hand; see RELEASING.md.
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/seancampbell3161/job-aggregator\
                    /compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/seancampbell3161/job-aggregator\
                    /tree/{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: https://github.com/seancampbell3161/job-aggregator\
            /compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
# Matched against the RAW subject (type prefix included); the body template
# renders the parsed description, so `feat(x): thing` matches "^feat" here and
# prints as "Thing".
#
# Order matters — first match wins, so the skips come first.
commit_parsers = [
    # Noise: merges, release chores, and the internal design artifacts we write
    # per feature (docs(spec)/docs(plan)) — nearly half of all docs commits, and
    # never something a reader of the changelog acts on.
    { message = "^Merge ", skip = true },
    { message = "^docs\\(spec|^docs\\(plan", skip = true },
    { message = "^chore", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
    { message = "^style", skip = true },

    # Deletions read as removals whatever type announced them, so these outrank
    # the type rules below.
    { message = "^.*: remove", group = "Removed" },
    { message = "^.*: delete", group = "Removed" },

    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^build", group = "Changed" },
    { message = "^docs", group = "Changed" },
    { message = "^.*", group = "Changed" },
]
# Prevent commits that are breaking from being excluded by commit parsers.
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
