services:
  poller:
    image: ghcr.io/seancampbell3161/job-aggregator:latest
    command: ["python", "-m", "src.scheduler"]
    restart: unless-stopped
    # Optional. Secrets can live in .env (a non-empty JOB_AGG_* value wins) or
    # in the app database (python -m src.settings set-secret NAME).
    env_file:
      - path: .env
        required: false
    environment:
      JOB_AGG_SQLITE_PATH: /data/job_aggregator.db
      JOB_AGG_TAILORED_DIR: /data/tailored
      JOB_AGG_TEMPLATES_DIR: /data/templates
    volumes:
      # Everything persistent — settings, documents, secrets, jobs, tailored
      # PDFs, résumé template packs — lives in ./data. In a clone, load settings with:
      #   docker compose run --rm -v "$PWD:/import:ro" web python -m src.settings import /import
      # A newcomer configures in the UI after logging in.
      - ./data:/data

  web:
    image: ghcr.io/seancampbell3161/job-aggregator:latest
    command: ["python", "-m", "src.web"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      JOB_AGG_SQLITE_PATH: /data/job_aggregator.db
      JOB_AGG_TAILORED_DIR: /data/tailored
      JOB_AGG_TEMPLATES_DIR: /data/templates
      JOB_AGG_WEB_HOST: 0.0.0.0
    ports:
      # The UI requires a login. The first visitor creates the password, so set
      # it right after `up` — or beforehand with
      #   docker compose run --rm -it web python -m src.settings set-password
      # (In a clone, you can also configure via the UI after logging in.)
      # Plain HTTP sends that password in cleartext: on a network you don't
      # trust, publish "127.0.0.1:8000:8000" and reach it over Tailscale or an
      # SSH tunnel, or put an HTTPS reverse proxy in front. Never port-forward
      # plain HTTP to the internet.
      - "8000:8000"
    healthcheck:
      # /healthz answers 200 whether or not the instance is set up, so an
      # unhealthy badge means the process is genuinely broken.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - ./data:/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Opt-in: only starts with `docker compose --profile ollama up`.
    # Cloud LLM users (anthropic/gemini) never need it.
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment to expose the Ollama API on the host:
    # ports:
    #   - "11434:11434"

volumes:
  ollama-models:
