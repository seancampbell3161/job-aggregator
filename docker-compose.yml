services:
  poller:
    build: .
    command: ["python", "-m", "src.scheduler"]
    restart: unless-stopped
    # Optional. Secrets can live in .env (a non-empty JOB_AGG_* value wins) or
    # in the app database (python -m src.settings set-secret NAME).
    env_file:
      - path: .env
        required: false
    environment:
      JOB_AGG_SQLITE_PATH: /data/job_aggregator.db
      JOB_AGG_TAILORED_DIR: /data/tailored
      JOB_AGG_TEMPLATES_DIR: /data/templates
    volumes:
      # Everything persistent — settings, documents, secrets, jobs, tailored
      # PDFs, résumé template packs — lives in ./data. Load settings with:
      #   docker compose run --rm -v "$PWD:/import:ro" web python -m src.settings import /import
      - ./data:/data

  web:
    build: .
    command: ["python", "-m", "src.web"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      JOB_AGG_SQLITE_PATH: /data/job_aggregator.db
      JOB_AGG_TAILORED_DIR: /data/tailored
      JOB_AGG_TEMPLATES_DIR: /data/templates
      JOB_AGG_WEB_HOST: 0.0.0.0
    ports:
      # WARNING: the web UI has NO authentication. "8000:8000" publishes it on
      # every interface, so anyone who can route to this host can read your
      # résumé, applications and apply-kit answers. On a shared or untrusted
      # network use "127.0.0.1:8000:8000" instead and reach it over Tailscale
      # or an SSH tunnel. Never port-forward this to the internet.
      - "8000:8000"
    volumes:
      - ./data:/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Opt-in: only starts with `docker compose --profile ollama up`.
    # Cloud LLM users (anthropic/gemini) never need it.
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment to expose the Ollama API on the host:
    # ports:
    #   - "11434:11434"

volumes:
  ollama-models:
